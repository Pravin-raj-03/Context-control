# v1 evaluation setup, kept only to reproduce runs made before 2026-10-09.
# It grades adversarial questions against their trap answers and omits session
# dates; use experiment=locomo_v2 (the default) for new runs.
name: default
output_dir: experiments/results
qa_timing: end          # Phase 1: run QA after the full conversation is replayed.
                        # Reserved for future: "per_session" streaming evaluation.
system_prompt: >-
  You are a helpful assistant answering questions about a long conversation.
  Answer concisely using only information from the conversation. If the answer
  is not present, say you don't know.
log_level: INFO
