[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbench"
version = "0.1.0"
description = "A modular framework for benchmarking context-management policies for conversational transformer models under fixed token budgets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ContextBench Authors" }]
keywords = ["nlp", "llm", "context-management", "benchmark", "locomo", "long-context"]

dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.30",
    "pydantic>=2.6",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
contextbench = "contextbench.cli:main"

[tool.setuptools.packages.find]
include = ["contextbench*"]
exclude = ["tests*", "configs*", "experiments*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: loads the real model; skipped unless CONTEXTBENCH_SLOW=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
